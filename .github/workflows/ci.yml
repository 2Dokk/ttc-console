name: 테스트

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Orekit 물리 데이터(약 40MB)는 매번 받지 않도록 캐시
      - uses: actions/cache@v4
        with:
          path: backend/orekit-data
          key: orekit-data-v1

      # Testcontainers가 GitHub 러너의 Docker로 PostgreSQL을 띄움
      - run: ./gradlew test

  frontend:
    name: 프론트엔드 타입 검사·빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
